<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Ranjan Marasini, Security Analyst">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0369a1"/><stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#0f172a0a" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.78" cy="0.28" r="0.55">
      <stop offset="0%" stop-color="#0369a1" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="340" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="14" fill="url(#grid)"/>
  <rect width="1200" height="340" rx="14" fill="url(#glow)"/>
  <rect x="0" y="0" width="6" height="340" rx="3" fill="url(#accent)"/>

  <!-- shield mark -->
  <g transform="translate(980,84)" opacity="0.9">
    <path d="M70 0 L136 26 V88 C136 132 106 166 70 180 C34 166 4 132 4 88 V26 Z"
          fill="none" stroke="#0369a1" stroke-width="2.5" opacity="0.55"/>
    <path d="M70 22 L114 40 V88 C114 118 94 142 70 152 C46 142 26 118 26 88 V40 Z"
          fill="#0369a1" opacity="0.07"/>
    <path d="M44 90 L62 110 L98 62" fill="none" stroke="#0f766e" stroke-width="6"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="64" y="112" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="54" font-weight="700" fill="#0f172a" letter-spacing="-0.5">Ranjan Marasini</text>

  <text x="64" y="156" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="23" font-weight="600" fill="url(#accent)">Security Analyst · SOC, SIEM &amp; Cloud Security</text>

  <text x="64" y="196" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
        font-size="15.5" fill="#64748b">Bharatpur, Nepal  ·  BCompSc Network Technology &amp; Cyber Security  ·  CGPA 3.87/4.00</text>

  <!-- credential chips -->
  <g font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600">
    <g transform="translate(64,232)">
      <rect width="290" height="40" rx="20" fill="#0369a10f" stroke="#0369a1" stroke-width="1.4"/>
      <text x="20" y="26" fill="#0f766e">★ 15th globally · Wiz Cloud Security</text>
    </g>
    <g transform="translate(370,232)"><rect width="82" height="40" rx="20" fill="#0f172a06" stroke="#0f172a1a"/><text x="21" y="26" fill="#334155">CEH</text></g>
    <g transform="translate(464,232)"><rect width="112" height="40" rx="20" fill="#0f172a06" stroke="#0f172a1a"/><text x="21" y="26" fill="#334155">ISC2 CC</text></g>
    <g transform="translate(588,232)"><rect width="106" height="40" rx="20" fill="#0f172a06" stroke="#0f172a1a"/><text x="20" y="26" fill="#334155">SC-900</text></g>
    <g transform="translate(706,232)"><rect width="106" height="40" rx="20" fill="#0f172a06" stroke="#0f172a1a"/><text x="20" y="26" fill="#334155">AZ-900</text></g>
    <g transform="translate(824,232)"><rect width="112" height="40" rx="20" fill="#0f172a06" stroke="#0f172a1a"/><text x="20" y="26" fill="#334155">APIsec</text></g>
  </g>
</svg>
